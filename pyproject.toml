[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-functa-shift"
version = "0.1.0"
description = "Clean project wrapper for U-Net FunCTA anatomy-shift experiments."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy",
  "torch",
  "h5py",
  "matplotlib",
  "pandas",
  "pillow",
  "scikit-image",
  "lpips",
  "tqdm",
  "einops",
  "pytorch_lightning",
]

[project.scripts]
unet-functa-shift = "unet_functa_shift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
